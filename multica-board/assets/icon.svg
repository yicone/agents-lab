<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Multica Board">
  <title>Multica Board</title>
  <!-- Scheme B master: two board frames around the eight-spoke mark. 16px favicon uses a heavier star. -->
  <rect width="1024" height="1024" rx="230" fill="#1A2330"/>
  <g fill="none" stroke="#F4F1EA" stroke-width="58" stroke-linejoin="round">
    <rect x="286" y="332" width="560" height="448" rx="64"/>
    <rect x="168" y="214" width="560" height="448" rx="64" fill="#1A2330" stroke="none"/>
    <rect x="168" y="214" width="560" height="448" rx="64"/>
  </g>
  <g fill="#F4F1EA" transform="translate(448 438)">
    <rect x="-168" y="-36" width="336" height="72" rx="8"/>
    <rect x="-36" y="-168" width="72" height="336" rx="8"/>
    <g transform="rotate(45)">
      <rect x="-158" y="-36" width="316" height="72" rx="8"/>
      <rect x="-36" y="-158" width="72" height="316" rx="8"/>
    </g>
  </g>
</svg>
