<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" role="img" aria-label="Multica Board" shape-rendering="crispEdges">
  <title>Multica Board</title>
  <!-- Scheme B at 16px: stacked boards, star simplified to a bold 8-spoke grid so the diagonals survive. -->
  <rect width="16" height="16" rx="4" fill="#1A2330"/>
  <rect x="2.5" y="3.5" width="12" height="10" rx="1.6" fill="none" stroke="#F4F1EA" stroke-width="1"/>
  <rect x="1.5" y="2.5" width="12" height="10" rx="1.6" fill="#1A2330"/>
  <rect x="1.5" y="2.5" width="12" height="10" rx="1.6" fill="none" stroke="#F4F1EA" stroke-width="1"/>
  <g fill="#F4F1EA">
    <rect x="4" y="4" width="1" height="1"/>
    <rect x="7" y="4" width="1" height="1"/>
    <rect x="10" y="4" width="1" height="1"/>
    <rect x="5" y="5" width="1" height="1"/>
    <rect x="7" y="5" width="1" height="1"/>
    <rect x="9" y="5" width="1" height="1"/>
    <rect x="6" y="6" width="3" height="1"/>
    <rect x="4" y="7" width="7" height="1"/>
    <rect x="6" y="8" width="3" height="1"/>
    <rect x="5" y="9" width="1" height="1"/>
    <rect x="7" y="9" width="1" height="1"/>
    <rect x="9" y="9" width="1" height="1"/>
    <rect x="4" y="10" width="1" height="1"/>
    <rect x="7" y="10" width="1" height="1"/>
    <rect x="10" y="10" width="1" height="1"/>
  </g>
</svg>
