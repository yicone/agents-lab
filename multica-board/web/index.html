<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Agent Atlas</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <h1 class="brand"><img class="brand-mark" src="favicon.svg" width="16" height="16" alt="Agent Atlas">Agent Atlas</h1>
      <nav class="tabs" aria-label="视图">
        <a class="tab" title="快捷键 1" data-view="issues" href="#/issues">收件箱 <span id="issues-badge" class="tab-badge" hidden></span></a>
        <a class="tab" title="快捷键 2" data-view="running" href="#/running">运行监控</a>
        <a class="tab" title="快捷键 3" data-view="configure" href="#/configure">配置管理</a>
        <a class="tab" title="快捷键 4" data-view="map" href="#/map">地图</a>
        <a class="tab" data-view="settings" href="#/settings" aria-label="设置" title="设置">⚙</a>
      </nav>
      <span id="snapshot" class="snapshot" aria-live="polite"></span>
      <label class="search">
        <span class="visually-hidden">搜索</span>
        <input id="search" type="search" placeholder="搜索 identifier / 标题 / agent / 模型" autocomplete="off" spellcheck="false">
        <kbd>/</kbd>
      </label>
    </div>
    <div id="banner" class="banner" role="alert" hidden></div>
  </header>
  <nav id="subnav" class="subnav" aria-label="子视图"></nav>
  <div id="health" class="health" aria-label="页面范围"></div>
  <main id="main" class="main"></main>
  <aside id="drawer" class="drawer" aria-label="issue 详情" hidden></aside>
</body>
</html>
